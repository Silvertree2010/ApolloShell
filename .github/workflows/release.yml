name: Release

# Tags only. Never on pull requests: the job needs the signing keys, and a
# foreign fork must never get near them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Sparkle's tools (generate_appcast). Pinned version with a checksum -
  # the tool signs updates, it must not change unnoticed.
  SPARKLE_VERSION: 2.10.0
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
  REPO_URL: https://github.com/Silvertree2010/ApolloShell

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: scripts/assemble-app.sh counts the commits
          # for CFBundleVersion. With the shallow default every version
          # would be build 1 - and Sparkle compares exactly that number, so
          # no release would ever be newer than the one before.
          fetch-depth: 0

      - name: Check that the tag matches the bundle version
        run: |
          set -o pipefail
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if [ "$tag" != "$plist" ]; then
            echo "tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist" >&2
            exit 1
          fi
          key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Support/Info.plist)
          if [ -z "$key" ]; then
            echo "SUPublicEDKey missing in Support/Info.plist (scripts/make-release-keys.sh)" >&2
            exit 1
          fi

      - name: Import the release certificate
        env:
          CERT_P12: ${{ secrets.RELEASE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/release-cert.p12"
          security import "$RUNNER_TEMP/release-cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          # Into the search list so `security find-identity` finds it
          # (scripts/assemble-app.sh asks exactly that way).
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/release-cert.p12"

      - name: Build the universal DMG
        env:
          SIGN_IDENTITY: ApolloShell Release Signing
        run: |
          set -o pipefail
          scripts/make-dmg.sh
          codesign --verify --deep --strict --verbose=2 "build/dist/ApolloShell.app"
          # Signed ad-hoc the check above would be happy too, but then
          # every user's Accessibility grant would be gone after every
          # update. So look explicitly at who signed.
          codesign -dvv "build/dist/ApolloShell.app" 2>&1 | grep -q "Authority=ApolloShell Release Signing"
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "build/dist/ApolloShell.app/Contents/Info.plist")
          if [ "$build" -le 1 ]; then
            echo "CFBundleVersion is $build - Sparkle could not tell one update from the next" >&2
            exit 1
          fi

      - name: Fetch the Sparkle tools
        run: |
          set -o pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin/generate_appcast

      - name: Generate and sign the appcast
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Take the earlier appcast along so the list of versions is
          # kept. There is none yet for the first release.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir dist || true
          printf '%s' "$SPARKLE_EDDSA_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$REPO_URL/releases/download/$GITHUB_REF_NAME/" \
            --full-release-notes-url "$REPO_URL/blob/main/CHANGELOG.md" \
            --link "$REPO_URL" \
            dist
          test -s dist/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          # Four parts read "0.1.2 Patch 2", three stay "0.1.2" - the way
          # the releases were named by hand.
          case "$version" in
            *.*.*.*) title="ApolloShell ${version%.*} Patch ${version##*.}" ;;
            *)       title="ApolloShell $version" ;;
          esac
          # The notes are the version's section from the changelog, not
          # just a link to it.
          notes=$(scripts/release-notes.sh "$version")
          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md]($REPO_URL/blob/main/CHANGELOG.md)."
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$title" \
            --notes "$notes" \
            "dist/ApolloShell-$version.dmg" \
            dist/appcast.xml

      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="$REPO_URL/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          # The same archive Homebrew downloads later.
          curl -fsSL -o "$RUNNER_TEMP/source.tar.gz" "$tarball"
          sha=$(shasum -a 256 "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
          if [ -z "$sha" ]; then
            echo "no checksum for $tarball" >&2
            exit 1
          fi
          # Write access via a deploy key that is valid for the tap repo
          # only - no token that fits every repo, and nothing left behind
          # in the URL or in .git/config.
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/ssh/id"
          chmod 600 "$RUNNER_TEMP/ssh/id"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          git clone --depth 1 git@github.com:Silvertree2010/homebrew-apolloshell.git "$RUNNER_TEMP/tap"
          formula="$RUNNER_TEMP/tap/Formula/apolloshell.rb"
          /usr/bin/sed -i '' -e "s|url \".*\"|url \"$tarball\"|" -e "s|sha256 \".*\"|sha256 \"$sha\"|" "$formula"
          # If the formula is already right (a rerun of the same tag),
          # that is not an error - the release is there, the formula just
          # was already.
          if git -C "$RUNNER_TEMP/tap" diff --quiet; then
            echo "formula already at $version"
            exit 0
          fi
          git -C "$RUNNER_TEMP/tap" -c user.name="ApolloShell Release" \
            -c user.email="noreply@github.com" \
            commit -am "ApolloShell $version"
          git -C "$RUNNER_TEMP/tap" push
