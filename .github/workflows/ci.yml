name: CI

on:
  push:
    branches: [main, framework]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            runner: macos-26
          - name: Intel
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TIMING_TESTS: EachBudgetTests|HostileConfigTests|ReloadBudgetTests|loadsDefaultSizedConfigInBudget|largeListReadsWithinBudget|largeListWithOneChangedEntryWithinBudget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release --product ApolloShell && swift build -c release --product apollo

      - name: Test
        run: ./test.sh --skip "$TIMING_TESTS"

      - name: Timing budgets, one test at a time
        if: success() || failure()
        run: ./test.sh --no-parallel --filter "$TIMING_TESTS"

      - name: Assemble and verify the app bundle
        run: |
          bin_path="$(swift build -c release --product ApolloShell --show-bin-path)"
          SIGN_IDENTITY=- scripts/assemble-app.sh "$bin_path/ApolloShell" "$RUNNER_TEMP/ApolloShell.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/ApolloShell.app"

